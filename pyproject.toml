[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Introduction to function calling in LLMs using constrained decoding"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "huggingface-hub>=0.20.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "accelerate>=1.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src"]
[tool.mypy]
exclude = [
    '^.venv',
    '^attachments_project_ai',
    '^llm_sdk',
    '^tests',
    '^lab',
    '^moulinette',
]